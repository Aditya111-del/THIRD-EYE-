<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>THIRD EYE — Connecting</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0d14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 520px;
      padding: 36px;
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #0f172a;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 10px; font-size: 19px; font-weight: 600; color: #f8fafc; }
    p { margin: 0 0 16px; font-size: 13.5px; color: #94a3b8; line-height: 1.5; }
    .badge {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      font-size: 11px;
      font-family: monospace;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .urls { font-size: 12px; color: #64748b; background: #090d16; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-family: monospace; }
    .btn-group { display: flex; gap: 10px; justify-content: center; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="badge">VITE DEV SERVER STARTING</div>
    <h2>Connecting to THIRD EYE IDE...</h2>
    <p>Waiting for the Vite dev server to finish initializing...</p>
    <div class="urls">Probing http://localhost:3000 (with fallbacks 8080, 3001, 5173)</div>
    <div class="btn-group">
      <button onclick="checkAndConnect()">Retry Connect</button>
    </div>
  </div>
  <script>
    const probePorts = [3000, 3001, 8080, 5173];
    let isRedirecting = false;

    function checkAndConnect() {
      if (isRedirecting) return;
      probePorts.forEach(function(port) {
        fetch('http://localhost:' + port, { mode: 'no-cors' })
          .then(function() {
            if (!isRedirecting) {
              isRedirecting = true;
              window.location.href = 'http://localhost:' + port;
            }
          })
          .catch(function() {});
      });
      setTimeout(checkAndConnect, 1200);
    }
    setTimeout(checkAndConnect, 1000);
  </script>
</body>
</html>
